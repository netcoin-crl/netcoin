# NetCoin wallet vhost (deploy on the node host). Serves the static wallet and
# proxies /api/* to the local node — the "dumb relay" holds no keys.
# certbot --nginx -d wallet.netcoin.online adds the 443 block + auto-renew.
server {
    listen 80;
    listen [::]:80;
    server_name wallet.netcoin.online;
    root /var/www/netcoin-wallet;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        proxy_pass http://127.0.0.1:28444/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }
}
