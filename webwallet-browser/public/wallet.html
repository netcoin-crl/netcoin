<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetCoin Wallet</title>
  <!-- Strict CSP: scripts only from our own origin (no inline script). The
       relay is same-origin, so connect-src 'self' suffices. SRI is added to the
       <script> tags at build/deploy time. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <style>
    :root { color-scheme: dark; --bg:#0b0e14; --card:#151a23; --fg:#e6e9ef; --mut:#9aa4b2; --acc:#3ddc97; --err:#ff6b6b; --bd:#222a36; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
    .wrap { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
    h1 { font-size:20px; margin:0 0 4px; } h1 span { color:var(--acc); }
    .sub { color:var(--mut); margin:0 0 20px; font-size:13px; }
    .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:18px; margin-bottom:16px; }
    label { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; }
    input, textarea, button { width:100%; font:inherit; border-radius:8px; border:1px solid var(--bd); background:#0e131b; color:var(--fg); padding:10px 12px; }
    textarea { resize:vertical; min-height:64px; }
    button { background:var(--acc); color:#06210f; border:none; font-weight:600; cursor:pointer; margin-top:14px; }
    button.secondary { background:transparent; color:var(--fg); border:1px solid var(--bd); }
    .mono { font-family:ui-monospace,Menlo,monospace; word-break:break-all; }
    .row { display:flex; gap:10px; } .row > * { flex:1; }
    .muted { color:var(--mut); font-size:12px; }
    .warn { border-left:3px solid var(--acc); background:#0e131b; padding:10px 12px; border-radius:6px; }
    .err { color:var(--err); } .ok { color:var(--acc); }
    .bal { font-size:28px; font-weight:700; } .bal small { font-size:14px; color:var(--mut); font-weight:400; }
    .hide { display:none; }
    .pill { display:inline-block; font-size:11px; color:var(--mut); border:1px solid var(--bd); border-radius:999px; padding:2px 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Net<span>Coin</span> Wallet</h1>
    <p class="sub">Non-custodial · keys never leave your browser · <span class="pill" id="netpill">testnet</span></p>

    <!-- WELCOME -->
    <div id="welcome" class="card hide">
      <p>Create a new wallet or restore one from your recovery phrase.</p>
      <button id="btnCreate">Create new wallet</button>
      <button id="btnRestore" class="secondary">Restore from recovery phrase</button>
    </div>

    <!-- CREATE: show phrase -->
    <div id="create" class="card hide">
      <p>Your recovery phrase. <strong>Write it down</strong> — it is the only way to restore this wallet, and we never see it.</p>
      <div class="warn mono" id="newPhrase"></div>
      <label>Set a password to encrypt this wallet on this device</label>
      <input id="createPw" type="password" placeholder="password" autocomplete="new-password" />
      <button id="btnCreateConfirm">I saved it — continue</button>
      <button id="btnCreateBack" class="secondary">Back</button>
      <p class="err" id="createErr"></p>
    </div>

    <!-- RESTORE -->
    <div id="restore" class="card hide">
      <label>Recovery phrase</label>
      <textarea id="restorePhrase" placeholder="net000 net001 ..." autocomplete="off"></textarea>
      <label>Password to encrypt on this device</label>
      <input id="restorePw" type="password" placeholder="password" autocomplete="new-password" />
      <button id="btnRestoreConfirm">Restore</button>
      <button id="btnRestoreBack" class="secondary">Back</button>
      <p class="err" id="restoreErr"></p>
    </div>

    <!-- UNLOCK -->
    <div id="unlock" class="card hide">
      <p>Unlock your wallet.</p>
      <input id="unlockPw" type="password" placeholder="password" autocomplete="current-password" />
      <button id="btnUnlock">Unlock</button>
      <button id="btnForget" class="secondary">Forget this wallet</button>
      <p class="err" id="unlockErr"></p>
    </div>

    <!-- WALLET -->
    <div id="walletView" class="hide">
      <div class="card">
        <label>Your address</label>
        <div class="mono" id="addr"></div>
        <div class="row">
          <button id="btnCopy" class="secondary">Copy address</button>
          <button id="btnRefresh" class="secondary">Refresh</button>
        </div>
      </div>
      <div class="card">
        <div class="muted">Spendable balance</div>
        <div class="bal"><span id="balNet">—</span> <small>NET</small></div>
        <div class="muted" id="balImmature"></div>
      </div>
      <div class="card">
        <h1 style="font-size:16px">Send</h1>
        <label>To address</label>
        <input id="toAddr" class="mono" placeholder="net1q..." autocomplete="off" />
        <label>Amount (NET)</label>
        <input id="amount" inputmode="decimal" placeholder="0.0" />
        <button id="btnSend">Review &amp; send</button>
        <p id="sendMsg"></p>
      </div>
      <button id="btnLock" class="secondary">Lock</button>
    </div>
  </div>

  <script src="netcoin-wallet.js" integrity="sha384-Uf7KDqoByyTMsociHIOLw6KZTIBFxLxBauwvjbKRPNvsD6sZ9SBnno3bewkAkN6D"></script>
  <script src="wallet-app.js" integrity="sha384-PGk8bP/JHf+jIYN+IC0awgHllinAPQ0szhYfE+GCuPgWGTuRtj4skI+0190t9orB"></script>
</body>
</html>
