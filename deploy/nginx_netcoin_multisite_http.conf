# Netcoin: one EC2 server, independent HTTP subdomains.
# Static files: /opt/netcoin/sites/<site>/index.html
# Netcoin node/API: http://127.0.0.1:28444
# Faucet service:  http://127.0.0.1:8081

map $host $netcoin_site_root {
    default                  /opt/netcoin/sites/explorer;
    netcoin.online           /opt/netcoin/sites/www;
    www.netcoin.online       /opt/netcoin/sites/www;
    wallet.netcoin.online    /opt/netcoin/sites/wallet;
    explorer.netcoin.online  /opt/netcoin/sites/explorer;
    pay.netcoin.online       /opt/netcoin/sites/pay;
    merchant.netcoin.online  /opt/netcoin/sites/merchant;
    faucet.netcoin.online    /opt/netcoin/sites/faucet;
    status.netcoin.online    /opt/netcoin/sites/status;
    community.netcoin.online /opt/netcoin/sites/community;
    markets.netcoin.online   /opt/netcoin/sites/markets;
    docs.netcoin.online      /opt/netcoin/sites/docs;
    api.netcoin.online       /opt/netcoin/sites/api;
}

server {
    listen 80;
    listen [::]:80;
    server_name netcoin.online www.netcoin.online wallet.netcoin.online explorer.netcoin.online pay.netcoin.online merchant.netcoin.online faucet.netcoin.online status.netcoin.online community.netcoin.online markets.netcoin.online docs.netcoin.online api.netcoin.online;
    root $netcoin_site_root;
    index index.html;
    location /api/ {
        proxy_pass http://127.0.0.1:28444/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /faucet {
        proxy_pass http://127.0.0.1:8081/faucet;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /faucet/status { proxy_pass http://127.0.0.1:8081/status; }
    location = /faucet/history { proxy_pass http://127.0.0.1:8081/history; }
    location = /faucet/queue { proxy_pass http://127.0.0.1:8081/queue; }
    location / { try_files $uri $uri/ /index.html; }
}
