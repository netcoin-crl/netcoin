name: Live Testnet Smoke

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

jobs:
  live-smoke:
    name: Host-header live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run live smoke against seed1
        run: |
          python tools/check_m1_live_smoke.py \
            --run \
            --out reports/live_smoke_history/live-smoke-${{ github.run_id }}.json \
            --history-dir reports/live_smoke_history
      - name: Upload live smoke history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-smoke-history
          path: reports/live_smoke_history/*.json
