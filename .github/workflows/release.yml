name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      - name: Install and test
        run: |
          python -m pip install -e ".[test]"
          python tools/run_test_suite_by_file.py --timeout 180
      - name: Import release signing key when configured
        # The secrets context is not allowed in step `if:` expressions (it
        # breaks workflow-file parsing), so gate inside the script via env.
        env:
          GPG_KEY: ${{ secrets.NETCOIN_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.NETCOIN_GPG_KEY_ID }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "no signing key configured; skipping import"
            exit 0
          fi
          printf '%s' "$GPG_KEY" | gpg --batch --import
          if [ -n "$GPG_KEY_ID" ]; then
            echo "NETCOIN_SIGNING_KEY=$GPG_KEY_ID" >> "$GITHUB_ENV"
          fi
      - name: Build signed-ready release artifact
        run: |
          chmod +x tools/make_release.sh
          tools/make_release.sh "${GITHUB_REF_NAME}"
          release_archive="$(ls dist/netcoin-*.zip)"
          echo "NETCOIN_RELEASE_ARCHIVE=$release_archive" >> "$GITHUB_ENV"
      - name: Verify release artifact
        run: python tools/verify_release.py dist
      - name: Sign release artifacts with GitHub OIDC
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cd dist
          for artifact in netcoin-*.zip netcoin-sbom.json SHA256SUMS; do
            cosign sign-blob "$artifact" --bundle "$artifact.sigstore.json" --yes
            cosign verify-blob "$artifact" \
              --bundle "$artifact.sigstore.json" \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER"
          done
      - name: Verify keyless release signatures
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: >
          python tools/verify_release.py dist
          --require-keyless
          --certificate-identity "$CERT_IDENTITY"
          --certificate-oidc-issuer "$OIDC_ISSUER"
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: ${{ env.NETCOIN_RELEASE_ARCHIVE }}
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: dist/netcoin-sbom.json
      - name: Attest checksum provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: NetCoin ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/netcoin-*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
            dist/*.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
