name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e .
          python -m pytest -q
      - name: Build signed-ready release artifact
        run: |
          chmod +x tools/make_release.sh
          tools/make_release.sh "${GITHUB_REF_NAME}"
      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NetCoin ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/netcoin-*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
