name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e ".[test]"
          python tools/run_test_suite_by_file.py --timeout 180
      - name: Import release signing key when configured
        # The secrets context is not allowed in step `if:` expressions (it
        # breaks workflow-file parsing), so gate inside the script via env.
        env:
          GPG_KEY: ${{ secrets.NETCOIN_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.NETCOIN_GPG_KEY_ID }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "no signing key configured; skipping import"
            exit 0
          fi
          printf '%s' "$GPG_KEY" | gpg --batch --import
          if [ -n "$GPG_KEY_ID" ]; then
            echo "NETCOIN_SIGNING_KEY=$GPG_KEY_ID" >> "$GITHUB_ENV"
          fi
      - name: Build signed-ready release artifact
        run: |
          chmod +x tools/make_release.sh
          tools/make_release.sh "${GITHUB_REF_NAME}"
      - name: Verify release artifact
        run: python tools/verify_release.py dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NetCoin ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/netcoin-*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
