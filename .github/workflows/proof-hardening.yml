name: NetCoin Proof Hardening

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  python-source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Python source and parity proof
        run: |
          python -m compileall -q netcoin tools
          python tools/run_parity_suite.py --no-write
          python tools/check_phase0_complete.py
          python tools/check_proof_hardening.py
          python tools/check_strict_proof_execution.py

  rust-strict-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust workspace tests
        run: cd core-rs && cargo test --workspace
      - name: Rust executable parity
        run: python tools/run_all_rust_parity.py --strict --out reports/all_rust_parity_report.json

  typescript-api-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: TypeScript API contract proof
        run: cd api && npm ci && npm run ci:api
      - name: Python API contract mirror
        run: python tools/run_ts_api_contract_enforcement.py

  browser-accessibility-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install Playwright runtime
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Browser product matrix
        run: python tools/run_browser_e2e_matrix.py --run-playwright --out reports/browser_e2e_matrix_report.json
      - name: Accessibility matrix
        run: python tools/run_accessibility_matrix.py --strict --out reports/accessibility_report.json

  release-readiness-scorecard:
    runs-on: ubuntu-latest
    needs: [python-source-proof, rust-strict-proof, typescript-api-proof, browser-accessibility-proof]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Strict release readiness scorecard
        run: python tools/run_release_readiness.py --strict --timeout 300 --out reports/release_readiness_scorecard.json
