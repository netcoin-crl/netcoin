name: Performance Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/run_perf_benchmark.py"
      - "tests/test_p2_perf_benchmark.py"
      - ".github/workflows/perf-benchmark.yml"
      - "netcoin/**"

jobs:
  perf-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run source performance benchmark
        run: |
          python tools/run_perf_benchmark.py \
            --blocks 12 \
            --bootstrap-blocks 101 \
            --mempool-transactions 12 \
            --out reports/perf/perf_benchmark_report.json
      - name: Upload performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netcoin-performance-benchmark
          path: reports/perf/perf_benchmark_report.json
