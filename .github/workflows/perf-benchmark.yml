name: Performance Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/run_perf_benchmark.py"
      - "tests/test_p2_perf_benchmark.py"
      - ".github/workflows/perf-benchmark.yml"
      - "netcoin/**"

jobs:
  perf-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run source performance benchmark
        run: |
          python tools/run_perf_benchmark.py \
            --blocks 12 \
            --bootstrap-blocks 101 \
            --mempool-transactions 12 \
            --out reports/perf/perf_benchmark_report.json
      - name: Upload performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netcoin-performance-benchmark
          path: reports/perf/perf_benchmark_report.json
