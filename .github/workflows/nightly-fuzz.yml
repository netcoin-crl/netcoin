name: Nightly Fuzz Accumulator

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Per-target fuzz iterations"
        required: false
        default: "2000000"

jobs:
  fuzz-accumulator:
    name: Fuzz history + consensus differential
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore fuzz history cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports/fuzz_history
          key: nightly-fuzz-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nightly-fuzz-${{ github.ref_name }}-
            nightly-fuzz-
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run nightly fuzz accumulator
        run: |
          python tools/run_nightly_fuzz_accumulator.py \
            --iterations "${{ github.event.inputs.iterations || '2000000' }}" \
            --history-dir reports/fuzz_history \
            --out reports/nightly_fuzz_report.json
      - name: Upload fuzz evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-fuzz-evidence
          path: |
            reports/nightly_fuzz_report.json
            reports/fuzz_history/*.json
            reports/fuzz_history_summary.json
