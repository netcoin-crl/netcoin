name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile Python package
        run: python -m compileall -q netcoin tools
      - name: Validate professional upgrade manifest
        run: python tools/professional_upgrade_audit.py --fail-on-issues
      - name: Generate source SBOM smoke check
        run: python tools/generate_sbom.py --out dist/netcoin-sbom.json
      - name: Validate competitive scaffold registry
        run: python tools/competitive_gap_report.py --level5 --json --out competitive-level5.json
      - name: Run tests
        run: python tools/run_test_suite_by_file.py --timeout 180

  release-zip:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release artifact and checksum
        run: |
          chmod +x tools/make_release.sh
          tools/make_release.sh HEAD
      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netcoin-build
          path: dist/

  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Deterministic fuzz smoke under Python dev mode
        run: python -X dev -m netcoin fuzz --target all --iterations 100 --max-bytes 128
