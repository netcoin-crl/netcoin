name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  fast:
    name: Fast checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up Node for source asset checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python package
        run: python -m compileall -q netcoin tools
        timeout-minutes: 2
      - name: Ruff lint (advisory)
        run: python -m ruff check netcoin tests tools
        continue-on-error: true
        timeout-minutes: 3
      - name: Black formatting check
        run: python -m black --check netcoin tests tools
        timeout-minutes: 3
      - name: Type check core modules (advisory)
        run: python -m mypy
        continue-on-error: true
        timeout-minutes: 5
      - name: Validate professional upgrade manifest
        run: python tools/professional_upgrade_audit.py --fail-on-issues
        timeout-minutes: 2
      - name: M1 source release-candidate gate
        run: python tools/run_m1_release_candidate.py --profile source --out reports/m1_release_candidate_report.json --stop-on-fail
        timeout-minutes: 8
      - name: Fast protocol/market tests with timeout budget
        run: make test-fast
        timeout-minutes: 10

  full:
    name: Full test suite with coverage
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Full pytest by file with per-file timeout budget
        run: python tools/run_test_suite_by_file.py --timeout 240
        timeout-minutes: 35
      - name: Coverage guardrails for core modules
        run: python tools/coverage_gate.py --minimum 55 --group-minimum 35 --packages consensus:40,wallet:35,mempool:35,markets:35,storage:35,api_auth:50
        timeout-minutes: 8

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Deterministic fuzz smoke under Python dev mode
        run: python -X dev -m netcoin fuzz --target all --iterations 250 --max-bytes 192
        timeout-minutes: 10
      - name: Consensus mutation smoke
        run: python tools/mutation_consensus_smoke.py
        timeout-minutes: 2

  browser:
    name: Browser wallet tests
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webwallet-browser/package-lock.json
      - name: npm ci and browser wallet tests
        run: cd webwallet-browser && npm ci && npm test
        timeout-minutes: 12
      - name: Syntax check public-site JavaScript
        run: find sites -name '*.js' -print0 | xargs -0 -n1 node --check
        timeout-minutes: 3

  rust:
    name: Rust core (build + parity tests)
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core-rs/**/Cargo.toml') }}
      - name: Toolchain
        run: cargo --version && rustc --version
      - name: Build workspace
        run: cargo build --workspace --manifest-path core-rs/Cargo.toml
        timeout-minutes: 15
      - name: Parity tests (Rust side must reproduce the frozen vectors)
        run: cargo test --workspace --manifest-path core-rs/Cargo.toml
        timeout-minutes: 10
      - name: Warnings report (advisory)
        run: cargo build --workspace --manifest-path core-rs/Cargo.toml 2>&1 | grep -c "^warning:" || true
        continue-on-error: true
        timeout-minutes: 5

  typescript:
    name: TypeScript API (typecheck + parity)
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        run: cd api && npm ci --no-audit --no-fund
      - name: Typecheck (tsc --noEmit, strict)
        run: cd api && npm run typecheck
      - name: Parity vectors (TS must reproduce the frozen vectors)
        run: cd api && npm run parity

  release-verification:
    name: Release verification
    runs-on: ubuntu-latest
    needs: [fast, full, fuzz, browser]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build release artifact and checksum
        run: |
          chmod +x tools/make_release.sh
          tools/make_release.sh HEAD
        timeout-minutes: 8
      - name: Verify checksum and SBOM
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test -s netcoin-sbom.json
        timeout-minutes: 2
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netcoin-build
          path: dist/
