[workspace]
members = [
  "crates/consensus",
  "crates/node",
  "crates/wallet-core",
  "crates/markets-core",
  "crates/mempool-core",
  "crates/signer-core",
  "crates/indexer-core"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/netcoin/netcoin"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
